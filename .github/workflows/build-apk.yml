name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verificar Android SDK (ja vem instalado no GitHub)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true


      - name: Instalar dependencias do projeto web
        run: npm install --legacy-peer-deps

      - name: Gerar versao web
        run: npm run build

      - name: Instalar Capacitor
        run: npm install --no-save --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Adicionar plataforma Android
        run: npx cap add android

      - name: Copiar arquivos web para o Android
        run: npx cap sync android

      - name: Compilar APK de debug
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
